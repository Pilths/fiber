line-length = 120
exclude = [
    ".venv",
    "app/seed.py",
    "app/ingest/excel.py",
    "**/excel_check*",
    "**/parse_workbook*",
    "alembic/versions/0001_baseline.py",
]

[lint]
# BLE001, S110: never swallow an error. T201: the server logs with `logging`, not `print`.
select = ["E701", "E702", "E703", "E501", "E741", "BLE001", "S110", "T201"]

[lint.per-file-ignores]
# Command-line scripts may print their output (CODING_STANDARDS.md, Errors and debugging).
"app/create_admin.py" = ["T201"]
"app/load_*.py" = ["T201"]
"app/seed_*.py" = ["T201"]
"tests/**" = ["T201"]
