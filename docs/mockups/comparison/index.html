<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI comparison</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  nav { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #d4d4d8; flex-wrap: wrap; align-items: center; }
  nav b { margin-right: 8px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #a1a1aa; background: #fff; border-radius: 6px; cursor: pointer; }
  button[aria-pressed="true"] { background: #18181b; color: #fff; border-color: #18181b; }
  #grid { display: grid; gap: 12px; padding: 12px; grid-template-columns: 1fr; }
  #grid.all { grid-template-columns: 1fr 1fr; }
  figure { margin: 0; background: #fff; border: 1px solid #d4d4d8; border-radius: 8px; overflow: hidden; }
  figcaption { padding: 8px 12px; font-weight: 600; border-bottom: 1px solid #d4d4d8; }
  figcaption a { font-weight: 400; margin-left: 8px; }
  iframe { display: block; width: 100%; height: calc(100vh - 110px); border: 0; }
  #grid.all iframe { height: 900px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<nav>
  <b>Fiber mockups</b>
  <button data-show="final">Final (desktop)</button>
  <button data-show="route">Route planning</button>
  <button data-show="merged">Merged (proposed)</button>
  <button data-show="fable-garden">Fable + Garden</button>
  <button data-show="fable-tastemaker">Fable + Tastemaker</button>
  <button data-show="opus-garden">Opus + Garden</button>
  <button data-show="opus-tastemaker">Opus + Tastemaker</button>
  <button data-show="all" aria-pressed="true">All 4</button>
  <button data-show="opus-taste">Opus + Taste</button>
  <button data-show="fable-taste">Fable + Taste</button>
  <button data-show="opus-impeccable">Opus + Impeccable</button>
  <button data-show="fable-impeccable">Fable + Impeccable</button>
</nav>
<div id="grid" class="all">
  <figure data-id="route" hidden><figcaption>Route planning with 2D route diagram <a href="route/index.html" target="_blank">open full</a></figcaption><iframe src="route/index.html" title="Route planning"></iframe></figure>
  <figure data-id="final" hidden><figcaption>Final desktop span view <a href="final/index.html" target="_blank">open full</a></figcaption><iframe src="final/index.html" title="Final"></iframe></figure>
  <figure data-id="merged" hidden><figcaption>Merged: Fable + Taste layout, Impeccable theme <a href="merged/index.html" target="_blank">open full</a></figcaption><iframe src="merged/index.html" title="Merged"></iframe></figure>
  <figure data-id="fable-garden" hidden><figcaption>Fable 5.1 + Garden (bake-off) <a href="bakeoff/fable-garden/index.html" target="_blank">open full</a></figcaption><iframe src="bakeoff/fable-garden/index.html" title="Fable 5.1 + Garden (bake-off)"></iframe></figure>
  <figure data-id="fable-tastemaker" hidden><figcaption>Fable 5.1 + Tastemaker (bake-off) <a href="bakeoff/fable-tastemaker/index.html" target="_blank">open full</a></figcaption><iframe src="bakeoff/fable-tastemaker/index.html" title="Fable 5.1 + Tastemaker (bake-off)"></iframe></figure>
  <figure data-id="opus-garden" hidden><figcaption>Opus 5.5 + Garden (bake-off) <a href="bakeoff/opus-garden/index.html" target="_blank">open full</a></figcaption><iframe src="bakeoff/opus-garden/index.html" title="Opus 5.5 + Garden (bake-off)"></iframe></figure>
  <figure data-id="opus-tastemaker" hidden><figcaption>Opus 5.5 + Tastemaker (bake-off) <a href="bakeoff/opus-tastemaker/index.html" target="_blank">open full</a></figcaption><iframe src="bakeoff/opus-tastemaker/index.html" title="Opus 5.5 + Tastemaker (bake-off)"></iframe></figure>
  <figure data-id="opus-taste"><figcaption>Opus 5.5 + Taste <a href="opus-taste/index.html" target="_blank">open full</a></figcaption><iframe src="opus-taste/index.html" title="Opus + Taste"></iframe></figure>
  <figure data-id="fable-taste"><figcaption>Fable 5.1 + Taste <a href="fable-taste/index.html" target="_blank">open full</a></figcaption><iframe src="fable-taste/index.html" title="Fable + Taste"></iframe></figure>
  <figure data-id="opus-impeccable"><figcaption>Opus 5.5 + Impeccable <a href="opus-impeccable/index.html" target="_blank">open full</a></figcaption><iframe src="opus-impeccable/index.html" title="Opus + Impeccable"></iframe></figure>
  <figure data-id="fable-impeccable"><figcaption>Fable 5.1 + Impeccable <a href="fable-impeccable/index.html" target="_blank">open full</a></figcaption><iframe src="fable-impeccable/index.html" title="Fable + Impeccable"></iframe></figure>
</div>
<script>
  const grid = document.getElementById('grid');
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    const show = b.dataset.show;
    document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-pressed', x === b));
    grid.classList.toggle('all', show === 'all');
    grid.querySelectorAll('figure').forEach(f => f.hidden = show === 'all' ? ['route','final','merged','fable-garden','fable-tastemaker','opus-garden','opus-tastemaker'].includes(f.dataset.id) : f.dataset.id !== show);
  });
</script>
</body>
</html>
