# Production stack: database and API. The API image contains the built web app and serves it.
# Machine-specific values live only in .env (copy .env.example).
services:
  db:
    image: postgis/postgis:18-3.6@sha256:b4466ea2ba7e3af54fcbba996d45325720f4b3ecb4f43f99b2f41367dc196f23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates only postgis on a new volume (the image's own script adds tiger geocoder and topology).
      - ./db/initdb/10_postgis.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      additional_contexts:
        certs: ./certs
        web: ./web
    restart: unless-stopped
    env_file: .env
    volumes:
      # Basemap and label fonts from scripts/get-tiles.sh, kept out of the image (about 600 MB).
      - ./web/public/map:/app/static/map:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
